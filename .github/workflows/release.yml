name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify versions match tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version manifest.json)
          source=$(sed -n 's/.*pluginVersion *= *"\([^"]*\)".*/\1/p' main.go)
          [ "$manifest" = "$version" ] || { echo "manifest.json=$manifest, tag=$version"; exit 1; }
          [ "$source" = "$version" ] || { echo "main.go=$source, tag=$version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version]"; exit 1; }

      - run: go vet ./...
      - name: Run tests and enforce critical-path coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1
          bash scripts/check-critical-coverage.sh coverage.out

      - name: Build package
        id: package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          id=$(jq -r .id manifest.json)
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stage/bin stage/scripts
          go build -trimpath -ldflags "-s -w" -o "stage/bin/$id" .
          cp manifest.json stage/
          install -m 0755 scripts/plugin-management.sh scripts/check-dns-integration.sh stage/scripts/
          (cd stage && zip -r "../$id-v$version.zip" .)
          unzip -Z1 "$id-v$version.zip" | grep -Fx "scripts/plugin-management.sh"
          unzip -Z1 "$id-v$version.zip" | grep -Fx "scripts/check-dns-integration.sh"
          sha256sum "$id-v$version.zip" > "$id-v$version.zip.sha256"
          echo "zip_path=$id-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Attest release package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip_path }}

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            *.zip *.zip.sha256
