name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Resolve and verify Go dependencies
        run: go mod tidy
      - name: Verify Go module files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Verify release tag belongs to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify versions match tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version manifest.json)
          source=$(sed -n 's/.*pluginVersion *= *"\([^"]*\)".*/\1/p' main.go)
          [ "$manifest" = "$version" ] || { echo "manifest.json=$manifest, tag=$version"; exit 1; }
          [ "$source" = "$version" ] || { echo "main.go=$source, tag=$version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version]"; exit 1; }

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Scan dependencies and call graph for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@ef4cb2f7cae47fe3e21fc596455f694951867b29 ./...

      - name: Build package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          id=$(jq -r .id manifest.json)
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stage/bin stage/scripts
          go build -trimpath -ldflags "-s -w" -o "stage/bin/$id" .
          cp manifest.json stage/
          install -m 0755 scripts/plugin-management.sh scripts/check-dns-integration.sh stage/scripts/
          (cd stage && zip -r "../$id-v$version.zip" .)
          unzip -Z1 "$id-v$version.zip" | grep -Fx "scripts/plugin-management.sh"
          unzip -Z1 "$id-v$version.zip" | grep -Fx "scripts/check-dns-integration.sh"
          sha256sum "$id-v$version.zip" > "$id-v$version.zip.sha256"

      - name: Sign package and checksum with Sigstore keyless signing
        run: |
          go install github.com/sigstore/cosign/v3/cmd/cosign@3428d3c2217e06f641de9f298ae597e2f85eb989
          export PATH="$(go env GOPATH)/bin:$PATH"
          file=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          checksum="${file}.sha256"
          cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          cosign sign-blob --yes --bundle "${checksum}.sigstore.json" "$checksum"

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            *.zip *.zip.sha256 *.sigstore.json
