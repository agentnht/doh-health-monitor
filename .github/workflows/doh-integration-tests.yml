name: DoH integration tests

on:
  pull_request:
    paths:
      - "internal/dohintegration/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "manifest.json"
      - "scripts/check-dns-integration.sh"
      - "scripts/doh-integration-dry-run.py"
      - "scripts/doh-integration-staging.py"
      - "scripts/lucx-ui-doh-api.py"
      - "scripts/xray_dns_planner.py"
      - "tests/test_doh_integration.py"
      - "tests/test_lucx_ui_doh_api.py"
      - "docs/lucx-ui-doh-integration.md"
      - "docs/lucx-ui-doh-integration-ru.md"
      - "docs/lucx-ui-selftest-lifecycle.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/doh-integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Resolve and verify Go dependencies
        run: go mod tidy
      - name: Run Go integration unit tests
        run: go test ./internal/dohintegration/... -v
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python tools and tests
        run: >-
          python -m py_compile
          scripts/doh-integration-dry-run.py
          scripts/doh-integration-staging.py
          scripts/lucx-ui-doh-api.py
          scripts/xray_dns_planner.py
          tests/test_doh_integration.py
          tests/test_lucx_ui_doh_api.py
      - name: Run unit and synthetic SQLite lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/check-dns-integration.sh
