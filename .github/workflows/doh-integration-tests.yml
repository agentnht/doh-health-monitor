name: DoH integration tests

on:
  pull_request:
    paths:
      - "internal/dohintegration/**"
      - "main.go"
      - "daemon.go"
      - "main_test.go"
      - "go.mod"
      - "go.sum"
      - "manifest.json"
      - "scripts/check-dns-integration.sh"
      - "scripts/doh-integration-dry-run.py"
      - "scripts/doh-integration-staging.py"
      - "scripts/lucx-ui-doh-api.py"
      - "scripts/xray_dns_planner.py"
      - "tests/test_doh_integration.py"
      - "tests/test_lucx_ui_doh_api.py"
      - "docs/lucx-ui-doh-integration.md"
      - "docs/lucx-ui-doh-integration-ru.md"
      - "docs/lucx-ui-selftest-lifecycle.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/doh-integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Resolve and verify Go dependencies
        run: go mod tidy
      - name: Run Go integration unit tests
        run: go test ./internal/dohintegration/... -v
      - name: Exercise Geosite loader against upstream production asset
        run: |
          curl -fsSL --retry 3 https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat -o "$RUNNER_TEMP/dlc.dat"
          curl -fsSL --retry 3 https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat.sha256sum -o "$RUNNER_TEMP/dlc.dat.sha256sum"
          (cd "$RUNNER_TEMP" && sha256sum -c dlc.dat.sha256sum)
          LUCX_TEST_GEOSITE_DAT="$RUNNER_TEMP/dlc.dat" LUCX_TEST_GEOSITE_CATEGORIES=CN go test . -run '^TestGeositeIndexLoadsConfiguredRealAsset      - name: Run race detector for integration package
        run: go test -race ./internal/dohintegration/...
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.x"
      - name: Compile Python tools and tests
        run: >-
          python -m py_compile
          scripts/doh-integration-dry-run.py
          scripts/doh-integration-staging.py
          scripts/lucx-ui-doh-api.py
          scripts/xray_dns_planner.py
          tests/test_doh_integration.py
          tests/test_lucx_ui_doh_api.py
      - name: Run unit and synthetic SQLite lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/check-dns-integration.sh
