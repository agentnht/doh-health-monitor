name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve and verify Go dependencies
        run: go mod tidy
      - name: Verify Go module files are tidy
        run: git diff --exit-code -- go.mod go.sum
      - name: Verify Go formatting
        run: |
          files="$(git ls-files '*.go')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "Go files must be formatted with gofmt:" "$unformatted"
            exit 1
          fi
      - name: Check shell and Web UI JavaScript syntax
        run: |
          bash -n scripts/plugin-management.sh
          bash -n scripts/check-dns-integration.sh
          bash -n scripts/test-check-dns-integration.sh
          bash -n scripts/test-plugin-management.sh
          node --check webui/app.js
      - name: Test plugin management shell helpers
        run: bash scripts/test-plugin-management.sh
      - name: Test approved Geosite DNS integration checker
        run: bash scripts/test-check-dns-integration.sh
      - run: go vet ./...
      - name: Run Go tests and collect coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1
      - name: Enforce critical-path coverage
        run: bash scripts/check-critical-coverage.sh coverage.out
      - name: Run Go race detector
        run: go test -race ./...
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@ef4cb2f7cae47fe3e21fc596455f694951867b29
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build Linux amd64 test package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          id=$(jq -r .id manifest.json)
          mkdir -p stage/bin stage/scripts
          go build -trimpath -ldflags "-s -w" -o "stage/bin/$id" .
          cp manifest.json stage/
          install -m 0755 scripts/plugin-management.sh scripts/check-dns-integration.sh stage/scripts/
          (cd stage && zip -r "../$id-pr-test.zip" .)
          unzip -Z1 "$id-pr-test.zip" | grep -Fx "scripts/plugin-management.sh"
          unzip -Z1 "$id-pr-test.zip" | grep -Fx "scripts/check-dns-integration.sh"
          sha256sum "$id-pr-test.zip" > "$id-pr-test.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doh-health-monitor-pr-test
          path: |
            doh-health-monitor-pr-test.zip
            doh-health-monitor-pr-test.zip.sha256
            coverage.out
          if-no-files-found: error
          retention-days: 7
